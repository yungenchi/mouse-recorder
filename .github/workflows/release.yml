name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install . pytest

      - name: Run tests
        run: pytest -q

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build executable
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --name mouse-recorder \
            --console \
            --paths src \
            packaging/macos_entrypoint.py
          mkdir -p release
          cp dist/mouse-recorder release/mouse-recorder-macos-${{ matrix.arch }}
          chmod +x release/mouse-recorder-macos-${{ matrix.arch }}
          cd release
          zip mouse-recorder-macos-${{ matrix.arch }}.zip mouse-recorder-macos-${{ matrix.arch }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mouse-recorder-macos-${{ matrix.arch }}
          path: release/*.zip


  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: mouse-recorder-macos-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
