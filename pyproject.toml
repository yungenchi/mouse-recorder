[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-recorder"
version = "0.1.0"
description = "A lightweight command-line mouse macro recorder."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.7.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mouse-recorder = "mouse_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
